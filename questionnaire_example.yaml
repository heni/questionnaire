title: "Оценка уровня сформированности учебной деятельности"
students: 40
student_label: "Ученик {n}"
statistics: true

student_fields:
  - ФИО
  - Класс
  - Возраст
  - Код учащегося

sections:
  - name: "Часть А"
    questions:
      - id: 1
        text: "Как ученик реагирует на новый фактический материал (конкретные сведения, факты, слова и пр.)"
        options:
          - code: а
            text: "безразлично"
          - code: б
            text: "эмоционально"

      - id: 2
        text: "Как ученик включается в выполнение новых практических заданий, в решение новых задач на применение хорошо известного способа"
        options:
          - "неохотно, безразлично"
          - "охотно"

      - id: 17
        text: "Как ученик включается в решение новой теоретической задачи?"
        options:
          - code: а
            text: "не включается"
          - code: б
            text: "включается, но затем теряет её основную цель"
          - code: в
            text: "включается, сохраняя всё существенное содержание цели"

  - name: "Часть Б"
    questions:
      - id: 1
        text: "Абсолютно безразличное отношение к новому фактическому материалу ученик проявляет"
        options:
          - "часто (или почти всегда)"
          - "редко (или никогда)"

      - id: 26
        text: "Ученик может перестроить усвоенный ранее способ действия в соответствии с условиями новой задачи"
        options:
          - "никогда"
          - "может с помощью"
          - "пытается самостоятельно, но не всегда может без помощи довести до конца"
          - "часто делает это самостоятельно"
